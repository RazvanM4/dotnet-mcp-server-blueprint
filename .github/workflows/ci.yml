name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Pack NuGet tool
        run: dotnet pack src/RazvanApps.McpServer.Blueprint/RazvanApps.McpServer.Blueprint.csproj --configuration Release --no-build -o ./artifacts

      - name: Validate server.json schema metadata
        run: |
          python3 -c "import json; d=json.load(open('server.json')); assert len(d['description'])<=100; assert d['name'].startswith('io.github.RazvanM4/')"

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
